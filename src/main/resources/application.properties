spring.application.name=spring_web_petshop

server.servlet.session.tracking-modes=cookie

# Server configuration
# If server.port is not specified, Spring Boot uses port 8080 by default.
# server.port=8081

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=validate

# MySQL database configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/db_petshop?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=mySql123#

# Locale configuration
spring.web.locale=es_PE
spring.web.locale-resolver=fixed
