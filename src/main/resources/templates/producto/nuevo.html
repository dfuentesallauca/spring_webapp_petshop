<html xmlns:th="http://www.thymeleaf.org" th:replace="layouts/layout :: layoutBase(~{::contenido})">

<div th:fragment="contenido">
	<h2 class="fw-bold mb-4">Gestión de Productos</h2>

	<div class="row g-4">
		<div class="col-md-6">
			<div class="card shadow-sm">
				<div class="card-body p-4">
					<h5 class="card-title mb-3">Nuevo producto</h5>
					<form th:action="@{/producto/registrar}" method="post" th:object="${producto}">
						<div class="mb-3">
							<label for="nombre" class="form-label">Nombre</label>
							<input type="text" class="form-control" th:field="*{nombre}" required>
						</div>
						<div class="mb-3">
							<label for="categoria" class="form-label">Categoría</label>
							<select class="form-select" th:field="*{categoria}" required>
								<option value="" selected hidden="hidden">-- Seleccionar --</option>
								<option th:each="item: ${lstCategorias}" th:value="${item.idCategoria}" th:text="${item.nombre}"></option>
							</select>
						</div>
						<div class="mb-3">
							<label for="precio" class="form-label">Precio (S/.)</label>
							<input type="number" class="form-control" step="0.01" min="0.01" th:field="*{precio}" required>
						</div>
						<div class="mb-3">
							<label for="stock" class="form-label">Stock</label>
							<input type="number" class="form-control" min="0" th:field="*{stock}" required>
						</div>
						<div class="mb-3">
							<label for="imagenUrl" class="form-label">URL de imagen <span class="text-muted">(opcional)</span></label>
							<input type="text" class="form-control" th:field="*{imagenUrl}">
						</div>
						<div class="d-flex gap-2">
							<button type="submit" class="btn btn-primary">Guardar</button>
							<a th:href="@{/producto/listado}" class="btn btn-outline-secondary">Cancelar</a>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>
</div>

</html>
