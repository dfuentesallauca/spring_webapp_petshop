<html xmlns:th="http://www.thymeleaf.org" th:replace="layouts/layout :: layoutBase(~{::contenido})">

<div th:fragment="contenido">
	<div class="d-flex justify-content-between align-items-center mb-4">
		<h2 class="fw-bold mb-0">Gestión de Productos</h2>
		<a th:href="@{/producto/nuevo}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Nuevo producto</a>
	</div>

	<div class="card shadow-sm mb-4">
		<div class="card-body">
			<form th:action="@{/producto/listado}" method="get" th:object="${filter}" class="row g-3 align-items-end">
				<div class="col-md-4">
					<label for="idCategoria" class="form-label">Categoría</label>
					<select class="form-select" th:field="*{idCategoria}">
						<option value="">Todas las categorías</option>
						<option th:each="item: ${lstCategorias}" th:value="${item.idCategoria}" th:text="${item.nombre}"></option>
					</select>
				</div>
				<div class="col-md-4 d-flex gap-2">
					<button type="submit" class="btn btn-primary">Filtrar</button>
					<a th:href="@{/producto/listado}" class="btn btn-outline-secondary">Ver todos</a>
				</div>
			</form>
		</div>
	</div>

	<div class="card shadow-sm">
		<div class="card-body p-0">
			<table class="table table-hover table-bordered mb-0">
				<thead class="table-light">
					<tr>
						<th>#</th>
						<th>Nombre</th>
						<th>Categoría</th>
						<th>Precio</th>
						<th>Stock</th>
						<th>Estado</th>
						<th>Acciones</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="item, stat:${lstProductos}">
						<td th:text="${stat.count}"></td>
						<td th:text="${item.nombre}"></td>
						<td th:text="${item.categoria.nombre}"></td>
						<td th:text="${#numbers.formatCurrency(item.precio)}"></td>
						<td th:text="${item.stock}"></td>
						<td>
							<span class="badge" th:classappend="${item.activo} ? 'bg-success' : 'bg-secondary'"
								th:text="${item.activoDescripcion}"></span>
						</td>
						<td class="d-flex gap-1">
							<a th:href="@{/producto/edicion/{id}(id=${item.idProducto})}" class="btn btn-sm btn-outline-primary">
								<i class="bi bi-pencil"></i> Editar
							</a>
							<form method="post" th:action="@{/producto/cambiar-activo}">
								<input type="hidden" name="id" th:value="${item.idProducto}">
								<button th:if="${item.activo}" type="submit" class="btn btn-sm btn-outline-danger"
									onclick="return confirm('¿Desactivar este producto?')">
									<i class="bi bi-slash-circle"></i> Desactivar
								</button>
								<button th:unless="${item.activo}" type="submit" class="btn btn-sm btn-outline-success"
									onclick="return confirm('¿Activar este producto?')">
									<i class="bi bi-check-circle"></i> Activar
								</button>
							</form>
						</td>
					</tr>
					<tr th:if="${#lists.isEmpty(lstProductos)}">
						<td colspan="7" class="text-center text-muted py-4">No hay productos registrados.</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</div>

</html>
