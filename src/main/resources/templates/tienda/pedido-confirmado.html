<html xmlns:th="http://www.thymeleaf.org" th:replace="layouts/layout :: layoutBase(~{::contenido})">

<div th:fragment="contenido">
	<div class="card shadow-sm col-md-8 mx-auto">
		<div class="card-body">
			<div class="text-center mb-4">
				<i class="bi bi-check-circle-fill text-success" style="font-size:3rem;"></i>
				<h3 class="fw-bold mt-2">¡Pedido confirmado!</h3>
				<p class="text-muted">Pedido <strong th:text="|#${idPedido}|"></strong> &mdash; Pago contra entrega</p>
			</div>

			<table class="table table-hover table-bordered mb-3">
				<thead class="table-light">
					<tr>
						<th>Producto</th>
						<th class="text-center">Cantidad</th>
						<th class="text-end">Precio unit.</th>
						<th class="text-end">Subtotal</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="item:${items}">
						<td th:text="${item.nombre}"></td>
						<td th:text="${item.cantidad}" class="text-center"></td>
						<td th:text="${#numbers.formatCurrency(item.precio)}" class="text-end"></td>
						<td th:text="${#numbers.formatCurrency(item.subtotal)}" class="text-end"></td>
					</tr>
				</tbody>
				<tfoot>
					<tr class="table-light fw-bold">
						<td colspan="3" class="text-end">Total</td>
						<td th:text="${#numbers.formatCurrency(total)}" class="text-end"></td>
					</tr>
				</tfoot>
			</table>

			<div class="d-flex gap-2 justify-content-end">
				<a th:href="@{/tienda/pedidos}" class="btn btn-outline-secondary">Ver mis pedidos</a>
				<a th:href="@{/tienda/productos}" class="btn btn-primary">Seguir comprando</a>
			</div>
		</div>
	</div>
</div>

</html>
