<html xmlns:th="http://www.thymeleaf.org" th:replace="layouts/layout :: layoutBase(~{::contenido})">

<div th:fragment="contenido">
	<div class="d-flex justify-content-between align-items-center mb-4">
		<h2 class="fw-bold mb-0">Gestión de Usuarios</h2>
		<a th:href="@{/usuario/nuevo}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Nuevo usuario</a>
	</div>

	<div class="card shadow-sm">
		<div class="card-body p-0">
			<table class="table table-hover table-bordered mb-0">
				<thead class="table-light">
					<tr>
						<th>#</th>
						<th>Nombre</th>
						<th>Correo</th>
						<th>Rol</th>
						<th>Estado</th>
						<th>Acciones</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="item:${lstUsuarios}">
						<td th:text="${item.idUsuario}"></td>
						<td th:text="${item.nombre}"></td>
						<td th:text="${item.email}"></td>
						<td>
							<span th:if="${item.rol == 'ADMIN'}" class="badge bg-primary">Admin</span>
							<span th:unless="${item.rol == 'ADMIN'}" class="badge bg-info text-dark">Cliente</span>
						</td>
						<td>
							<span class="badge" th:classappend="${item.activo} ? 'bg-success' : 'bg-secondary'"
								th:text="${item.activo} ? 'Activo' : 'Inactivo'"></span>
						</td>
						<td class="d-flex gap-1">
							<a th:href="@{/usuario/edicion/{id}(id=${item.idUsuario})}" class="btn btn-sm btn-outline-primary">
								<i class="bi bi-pencil"></i> Editar
							</a>
							<form method="post" th:action="@{/usuario/cambiar-activo}">
								<input type="hidden" name="id" th:value="${item.idUsuario}">
								<button th:if="${item.activo}" type="submit" class="btn btn-sm btn-outline-danger"
									onclick="return confirm('¿Desactivar este usuario?')">
									<i class="bi bi-slash-circle"></i> Desactivar
								</button>
								<button th:unless="${item.activo}" type="submit" class="btn btn-sm btn-outline-success"
									onclick="return confirm('¿Activar este usuario?')">
									<i class="bi bi-check-circle"></i> Activar
								</button>
							</form>
						</td>
					</tr>
					<tr th:if="${#lists.isEmpty(lstUsuarios)}">
						<td colspan="6" class="text-center text-muted py-4">No hay usuarios registrados.</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</div>

</html>
