<html xmlns:th="http://www.thymeleaf.org" th:replace="layouts/layout :: layoutBase(~{::contenido})">

<div th:fragment="contenido">
	<h2 class="fw-bold mb-4">Gestión de Categorías</h2>

	<div class="row g-4">
		<div class="col-md-5">
			<div class="card shadow-sm">
				<div class="card-body p-4">
					<h5 class="card-title mb-3">Nueva categoría</h5>
					<form th:action="@{/categoria/registrar}" method="post" th:object="${categoria}">
						<div class="mb-3">
							<label for="nombre" class="form-label">Nombre</label>
							<input type="text" class="form-control" th:field="*{nombre}" required autofocus>
						</div>
						<div class="d-flex gap-2">
							<button type="submit" class="btn btn-primary">Guardar</button>
							<a th:href="@{/categoria/listado}" class="btn btn-outline-secondary">Cancelar</a>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>
</div>

</html>
