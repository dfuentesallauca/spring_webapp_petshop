<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>PetShop — Iniciar sesión</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	<style>
		:root { --bs-primary: #2C7A7B; --bs-primary-rgb: 44,122,123; }
		body { background-color: #f8f9fa; }
		.btn-primary { background-color: #2C7A7B; border-color: #2C7A7B; }
		.btn-primary:hover { background-color: #1F5F60; border-color: #1F5F60; }
		.login-card { max-width: 420px; margin: 80px auto; }
	</style>
</head>

<body>
	<div class="login-card card shadow-sm p-4">
		<h4 class="mb-4 text-center">🐾 Patitas Felices — Acceso</h4>

		<form th:action="@{/iniciar-sesion}" method="post" th:object="${filter}">
			<div class="mb-3">
				<label for="email" class="form-label">Correo electrónico</label>
				<input type="email" class="form-control" th:field="*{email}" required autofocus>
			</div>
			<div class="mb-3">
				<label for="password" class="form-label">Contraseña</label>
				<input type="password" class="form-control" th:field="*{password}" required>
			</div>
			<button type="submit" class="btn btn-primary w-100">Ingresar</button>
		</form>
	</div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<th:block th:utext="${alert}"></th:block>
</body>
</html>
